# BrowserX mobile — Gradle settings.
# Gradle daemon off by default: the NDK build already parallelises, and a daemon
# holding 1 GB of RAM next to a "low RAM mode" browser is a bad look.
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official
